# Replay counterpart for the ios-simulator snapshot scenario: include cordis.yml
# directly (a config patch cannot target an entry behind a nested include), then
# add the simulator packages and replace the live model with keyless replay.
# The simctl substrate is stubbed on PATH by the suite — scripts, canned device
# JSON, and a fixed PNG live under tests/fixtures/iossim/stub/; the provider,
# subprocess seam, tools, attachment store, and session log all stay real.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: attachments-local
            name: '@deepseek-ai/dsh-attachment-local'
          - id: ios-sim
            name: '@deepseek-ai/dsh-ios-sim-simctl'
          - id: tool-ios-sim
            name: '@deepseek-ai/dsh-tool-ios-sim'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
