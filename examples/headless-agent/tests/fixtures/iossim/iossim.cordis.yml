- id: ios-sim-mock-llm
  name: './ios-sim-mock-llm.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: ios-sim-mock
              model: ios-sim-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          dshHome: './.dsh-home'
          persona: 'Keyless ios-sim snapshot.'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
          compression: none
      - insert:
          - id: attachments-local
            name: '@deepseek-ai/dsh-attachment-local'
          - id: ios-sim
            name: '@deepseek-ai/dsh-ios-sim-simctl'
          - id: tool-ios-sim
            name: '@deepseek-ai/dsh-tool-ios-sim'
