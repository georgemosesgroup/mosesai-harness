# XcodeGen manifest for the iossim-helper native helper (see README.md).
#
# The four framework targets transcribe the pinned upstream definitions from
# the idb project.yml (vendored under vendor/idb/, commit pinned in
# vendor/README.md) with one mechanical change: every $(SRCROOT)-relative
# vendor path becomes $(VENDOR_ROOT), because the vendored tree stays pristine
# and this manifest owns the build glue. The shared warning configuration
# (OTHER_CFLAGS) is identical across the four upstream framework targets and is
# hoisted to project level; per-target flags below are the upstream
# per-target ones (private-framework module maps, weak libraries).
#
# All framework targets build as static libraries (upstream's MACH_O_TYPE), so
# the iossim-helper executable links them into ONE self-contained binary with
# no frameworks to ship or sign beside it.

name: iossim-helper

options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  bundleIdPrefix: com.facebook

configFiles:
  Debug: ../../vendor/idb/Configuration/Shared.xcconfig
  Release: ../../vendor/idb/Configuration/Shared.xcconfig

settings:
  base:
    VENDOR_ROOT: $(PROJECT_DIR)/../../vendor/idb
    # Upstream sets the PrivateHeaders root on the project so the vendored
    # private-framework module maps' relative includes resolve.
    HEADER_SEARCH_PATHS: $(inherited) $(VENDOR_ROOT)/PrivateHeaders
    OTHER_CFLAGS: $(inherited) -Werror -Wall -Warray-bounds-pointer-arithmetic -Wassign-enum -Wcompare-distinct-pointer-types -Wconversion -Wdeprecated -Wduplicate-method-match -Wglobal-constructors -Wimplicit-fallthrough -Wimplicit-retain-self -Wint-in-bool-context -Wmissing-prototypes -Wnonportable-include-path -Wnonportable-system-include-path -Wnull-pointer-arithmetic -Wnull-pointer-subtraction -Wnullable-to-nonnull-conversion -Wobjc-signed-char-bool -Wrange-loop-analysis -Wshadow -Wstrict-prototypes -Wstring-concatenation -Wundeclared-selector -Wunguarded-availability -Wunterminated-string-initialization -Wunreachable-code-return -Wunused-function -Wno-error=conditional-uninitialized -Wno-error=objc-designated-initializers -Wno-error=objc-dictionary-duplicate-keys -Wno-error=pointer-to-enum-cast -Wno-error=pointer-to-int-cast -Werror=void-pointer-to-int-cast -Wno-error=tautological-bitwise-compare -Wno-error=tautological-compare -Wno-error=tautological-constant-compare -Wno-error=tautological-constant-in-range-compare -Wno-error=tautological-constant-out-of-range-compare -Wno-error=tautological-negation-compare -Wno-error=tautological-objc-bool-compare -Wno-error=tautological-overlap-compare -Wno-error=tautological-pointer-compare -Wno-error=tautological-type-limit-compare -Wno-error=tautological-undefined-compare -Wno-error=tautological-unsigned-char-zero-compare -Wno-error=tautological-unsigned-enum-zero-compare -Wno-error=tautological-unsigned-zero-compare -Wno-error=tautological-value-range-compare -Wno-error=unreachable-code-break -Wno-error=unreachable-code-fallthrough -Wno-error=unreachable-code-loop-increment -Wno-error=unreachable-code -Wno-error=unused-but-set-parameter -Wno-error=unused-but-set-variable -Wno-error=void-pointer-to-enum-cast -Wno-error=suggest-override -Wno-error=extra-semi -Wno-error=missing-noreturn -Wno-error=format-nonliteral -Wno-error=non-virtual-dtor -Wno-covered-switch-default -Wswitch-enum -Wswitch-default -Wno-error=c23-extensions -Wno-error=vla-cxx-extension -Wmissing-field-initializers -Wno-error=missing-field-initializers -Wbitwise-conditional-parentheses -Wno-error=bitwise-conditional-parentheses -Wlogical-not-parentheses -Wno-error=logical-not-parentheses -Wlogical-op-parentheses -Wno-error=logical-op-parentheses -Wno-float-conversion -Wno-implicit-float-conversion -Wno-implicit-int-float-conversion -Wno-implicit-int-conversion -Wno-shorten-64-to-32 -Wno-sign-conversion -Wfloat-overflow-conversion -Wfloat-zero-conversion -Wobjc-signed-char-bool-implicit-float-conversion -Wobjc-signed-char-bool-implicit-int-conversion -Wno-deprecated-declarations -Wno-deprecated-copy-dtor -Wno-deprecated-copy-with-dtor -Wno-deprecated-dynamic-exception-spec -Wno-deprecated-implementations -Wno-deprecated-redundant-constexpr-static-def -Wno-non-c-typedef-for-linkage -Wno-psabi -Wno-gnu-folding-constant -Wno-c99-designator -Wno-deprecated-copy -Wno-final-dtor-non-final-class -Wno-gnu-inline-cpp-without-extern -Wno-range-loop-construct -Wno-reorder-init-list -Wno-deprecated-this-capture -Wno-error=ambiguous-reversed-operator -Wno-error=deprecated-anon-enum-enum-conversion -Wenum-enum-conversion -Wmisleading-indentation -Wno-unknown-warning-option -Wno-module-conflict -Wno-deprecated-copy-with-user-provided-dtor -Wno-deprecated-experimental-coroutine -Wundef-prefix=__IPHONE_1,__IPHONE_2,__IPHONE_3,FB_AT_LEAST_IOS,META_AT_LEAST,FB_IOS,META_IOS,FB_64,META_64,META_TARGET,FBReport,FB_SWITCH -DDEFAULT_WARNING_FLAGS_SENTINEL=1 -Werror=sign-conversion -Werror=shorten-64-to-32 -Wnullability-completeness -fobjc-arc-exceptions -Wno-deprecated-declarations -Wno-error=unused-command-line-argument

targets:
  CompanionUtilities:
    type: framework
    platform: macOS
    sources:
      - path: ../../vendor/idb/CompanionUtilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facebook.CompanionUtilities
        PRODUCT_NAME: CompanionUtilities
        DEFINES_MODULE: "YES"
        MACH_O_TYPE: staticlib
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        CLANG_ENABLE_OBJC_ARC: "YES"
        # Upstream: the @TaskLocal macro sometimes cannot load under Xcode 26's
        # plugin sandbox; disable the frontend sandbox so the macro
        # implementation can spawn.
        OTHER_SWIFT_FLAGS: $(inherited) -Xfrontend -disable-sandbox
    dependencies:
      - sdk: Foundation.framework

  XCTestBootstrap:
    type: framework
    platform: macOS
    sources:
      - path: ../../vendor/idb/XCTestBootstrap
        excludes:
          - "**/*-Info.plist"
          - "**/*.xcconfig"
          - "**/*.md"
          - "**/*.modulemap"
      - path: ../../vendor/idb/Shims/Shimulator/Tools/FBXCTestConstants.h
        headerVisibility: project
    settings:
      base:
        INFOPLIST_FILE: $(VENDOR_ROOT)/XCTestBootstrap/XCTestBootstrap-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.facebook.XCTestBootstrap
        PRODUCT_NAME: XCTestBootstrap
        DEFINES_MODULE: "YES"
        MACH_O_TYPE: staticlib
        SWIFT_VERSION: "6.0"
        MODULEMAP_FILE: $(VENDOR_ROOT)/XCTestBootstrap/module.modulemap
        HEADER_SEARCH_PATHS: $(inherited) $(VENDOR_ROOT)/Shims/Shimulator/Tools
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(DEVELOPER_DIR)/Library/PrivateFrameworks
        CLANG_ENABLE_OBJC_ARC: "YES"
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(VENDOR_ROOT)/PrivateHeaders/DTXConnectionServices/module.modulemap -Xcc -fmodule-map-file=$(VENDOR_ROOT)/PrivateHeaders/AXRuntime/module.modulemap
    dependencies:
      - target: FBControlCore
        embed: false
      - sdk: Cocoa.framework
      - sdk: Foundation.framework
      - sdk: IOKit.framework

  FBControlCore:
    type: framework
    platform: macOS
    sources:
      - path: ../../vendor/idb/FBControlCore
        excludes:
          - "**/*-Info.plist"
          - "**/*.xcconfig"
    settings:
      base:
        INFOPLIST_FILE: $(VENDOR_ROOT)/FBControlCore/FBControlCore-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.facebook.FBControlCore
        PRODUCT_NAME: FBControlCore
        DEFINES_MODULE: "YES"
        MACH_O_TYPE: staticlib
        SWIFT_VERSION: "6.0"
        # Mixed-language workaround (upstream): Xcode 26 omits the Swift
        # module's emit directory from HEADER_SEARCH_PATHS, so
        # `#import "<Module>-Swift.h"` in .m files needs the per-arch Swift
        # output dir explicitly.
        HEADER_SEARCH_PATHS: $(inherited) $(VENDOR_ROOT)/PrivateHeaders $(OBJECT_FILE_DIR_normal)/$(CURRENT_ARCH)
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(DEVELOPER_DIR)/Library/PrivateFrameworks
        CLANG_ENABLE_OBJC_ARC: "YES"
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(VENDOR_ROOT)/PrivateHeaders/AXRuntime/module.modulemap
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Cocoa.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMedia.framework
      - sdk: Foundation.framework
      - sdk: ServiceManagement.framework

  FBSimulatorControl:
    type: framework
    platform: macOS
    sources:
      - path: ../../vendor/idb/FBSimulatorControl
        excludes:
          - "**/*-Info.plist"
          - "**/*.xcconfig"
      - path: ../../vendor/idb/REPL/IDB/IDBAPI.swiftinterface
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: $(VENDOR_ROOT)/FBSimulatorControl/FBSimulatorControl-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.facebook.FBSimulatorControl
        PRODUCT_NAME: FBSimulatorControl
        DEFINES_MODULE: "YES"
        MACH_O_TYPE: staticlib
        SWIFT_VERSION: "6.0"
        HEADER_SEARCH_PATHS: $(inherited) $(VENDOR_ROOT)/PrivateHeaders $(OBJECT_FILE_DIR_normal)/$(CURRENT_ARCH)
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(DEVELOPER_DIR)/Library/PrivateFrameworks
        CLANG_ENABLE_OBJC_ARC: "YES"
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(VENDOR_ROOT)/PrivateHeaders/AccessibilityPlatformTranslation/module.modulemap -Xcc -fmodule-map-file=$(VENDOR_ROOT)/PrivateHeaders/CoreSimDeviceIO/module.modulemap -Xcc -fmodule-map-file=$(VENDOR_ROOT)/PrivateHeaders/CoreSimulatorUtilities/module.modulemap -Xcc -fmodule-map-file=$(VENDOR_ROOT)/PrivateHeaders/DTXConnectionServices/module.modulemap -Xcc -fmodule-map-file=$(VENDOR_ROOT)/PrivateHeaders/SimulatorApp/module.modulemap -Xcc -fmodule-map-file=$(VENDOR_ROOT)/PrivateHeaders/SimulatorKit/module.modulemap -Xcc -fmodule-map-file=$(VENDOR_ROOT)/PrivateHeaders/CoreSimulator/module.modulemap -Xcc -fmodule-map-file=$(VENDOR_ROOT)/PrivateHeaders/AXRuntime/module.modulemap
        # Upstream: CoreSimulator and AccessibilityPlatformTranslation are
        # loaded at runtime; Swift generates direct class references that must
        # be satisfied at link time, so weak-link against the TBD stubs.
        OTHER_LDFLAGS: $(inherited) -weak_library $(VENDOR_ROOT)/PrivateHeaders/CoreSimulator/CoreSimulator.tbd -weak_library $(VENDOR_ROOT)/PrivateHeaders/AccessibilityPlatformTranslation/AccessibilityPlatformTranslation.tbd
    dependencies:
      - target: CompanionUtilities
        embed: false
      - target: FBControlCore
        embed: false
      - target: XCTestBootstrap
        embed: false
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: Cocoa.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreImage.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: VideoToolbox.framework

  iossim-helper:
    type: tool
    platform: macOS
    sources:
      - path: src
    settings:
      base:
        PRODUCT_NAME: iossim-helper
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        CLANG_ENABLE_OBJC_ARC: "YES"
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(DEVELOPER_DIR)/Library/PrivateFrameworks
        # Static frameworks contribute objects, not link flags. The weak
        # libraries FBSimulatorControl declares upstream must be carried by
        # the final link (CoreSimulator and AccessibilityPlatformTranslation
        # load at runtime from the selected Xcode), and -ObjC keeps every
        # ObjC category in the static libraries — without it the linker dead-
        # strips category methods nothing references directly (the runtime
        # calls them reflectively).
        OTHER_LDFLAGS: $(inherited) -ObjC -weak_library $(VENDOR_ROOT)/PrivateHeaders/CoreSimulator/CoreSimulator.tbd -weak_library $(VENDOR_ROOT)/PrivateHeaders/AccessibilityPlatformTranslation/AccessibilityPlatformTranslation.tbd
    dependencies:
      - target: CompanionUtilities
        embed: false
      - target: FBControlCore
        embed: false
      - target: XCTestBootstrap
        embed: false
      - target: FBSimulatorControl
        embed: false

schemes:
  iossim-helper:
    build:
      targets:
        iossim-helper: [release]
