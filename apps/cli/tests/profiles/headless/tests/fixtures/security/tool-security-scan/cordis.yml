# REAL-composition fixture: the three security packages over the real
# subprocess service. Scanner binaries are stubbed to a POSIX script so the
# scenario runs keyless; the allowlist is the authorization boundary under test.
- id: invariants
  name: '@deepseek-ai/dsh-invariants'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: security-scan
  name: '@deepseek-ai/dsh-security-scan-moses'
  config:
    allowlist: ['stub.test', '.auth.test']

- id: security-scan-local
  name: '@deepseek-ai/dsh-security-scan-local-moses'
  config:
    binPaths:
      nuclei: !!js process.env.SECURITY_STUB_BIN
      httpx: !!js process.env.SECURITY_STUB_BIN
      katana: !!js process.env.SECURITY_STUB_BIN
      ffuf: !!js process.env.SECURITY_STUB_BIN
      nmap: !!js process.env.SECURITY_STUB_BIN
      sqlmap: !!js process.env.SECURITY_STUB_BIN
    wordlistDirs: [!!js process.env.SECURITY_STUB_CWD]
    cwd: !!js process.env.SECURITY_STUB_CWD
    timeoutMs: 20000

- id: tool-security-scan
  name: '@deepseek-ai/dsh-tool-security-scan-moses'

# The consumer registers into these host registries; both are effect-scoped.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

# Invariant companions mount with the packages they own, so the composition
# exercises the same registrations production carries.
- id: security-scan-invariant
  name: '@deepseek-ai/dsh-security-scan-moses/invariant'

- id: security-scan-local-invariant
  name: '@deepseek-ai/dsh-security-scan-local-moses/invariant'

- id: tool-security-scan-invariant
  name: '@deepseek-ai/dsh-tool-security-scan-moses/invariant'
