# Keyless security-scan composition for the assembled stream-json snapshot:
# the base demo tree with its DeepSeek adapter replaced by the scripted
# security-mock adapter and the three-package seam mounted over stub binaries.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true

      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: security-mock
              model: sec-mock
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          persona: 'Authorized scanning demo.'

      - insert:
          - id: llm-security-mock
            name: './tests/fixtures/security/security-mock-llm.ts'

          - id: security-scan
            name: '@deepseek-ai/dsh-security-scan-moses'
            config:
              allowlist: ['stub.test']

          # The smoke harness copies the executable stub into the generated
          # cwd before boot, so the relative pinned path resolves there.
          - id: security-scan-local
            name: '@deepseek-ai/dsh-security-scan-local-moses'
            config:
              binPaths:
                nuclei: ./scanner-stub
              cwd: !!js process.cwd()
              timeoutMs: 20000

          - id: tool-security-scan
            name: '@deepseek-ai/dsh-tool-security-scan-moses'
